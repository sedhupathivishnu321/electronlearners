<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" width="100%" height="100%" style="background-color: #070c18; font-family: 'Segoe UI', Arial, sans-serif;">
  <defs>
    <!-- Gradients & Filters -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b132b"/>
      <stop offset="100%" stop-color="#030712"/>
    </linearGradient>
    
    <linearGradient id="unoGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0088cc"/>
      <stop offset="100%" stop-color="#004477"/>
    </linearGradient>
    
    <linearGradient id="bbGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#e2e8f0"/>
    </linearGradient>
    
    <radialGradient id="ledRedGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ff4d4d"/>
      <stop offset="70%" stop-color="#cc0000"/>
      <stop offset="100%" stop-color="#880000"/>
    </radialGradient>
    
    <radialGradient id="ledGreenGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#55ff55"/>
      <stop offset="70%" stop-color="#00aa00"/>
      <stop offset="100%" stop-color="#005500"/>
    </radialGradient>

    <radialGradient id="ledYellowGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffff55"/>
      <stop offset="70%" stop-color="#cccc00"/>
      <stop offset="100%" stop-color="#777700"/>
    </radialGradient>
    
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <rect width="900" height="500" fill="url(#bgGrad)" rx="20" stroke="#1e293b" stroke-width="3"/>
  
  <!-- Header Bar -->
  <rect x="25" y="20" width="850" height="45" rx="12" fill="#0f172a" stroke="#3b82f6" stroke-width="2"/>
  <text x="45" y="48" fill="#60a5fa" font-size="16" font-weight="900" letter-spacing="1">CIRCUIT SCHEMATIC & BREADBOARD LAYOUT</text>
  <rect x="680" y="28" width="180" height="28" rx="8" fill="#2563eb"/>
  <text x="770" y="47" fill="#ffffff" font-size="13" font-weight="bold" text-anchor="middle">EXP #2: TRAFFIC LIGHT CONTROLLER</text>
  
  <!-- ARDUINO UNO BOARD GRAPHIC -->
  <g transform="translate(45, 90)">
    <!-- Board PCB -->
    <rect x="0" y="0" width="260" height="350" rx="14" fill="url(#unoGrad)" stroke="#00bfff" stroke-width="2"/>
    <rect x="10" y="10" width="240" height="330" rx="10" fill="none" stroke="#ffffff" stroke-width="1" stroke-opacity="0.2"/>
    
    <!-- USB Connector -->
    <rect x="15" y="-15" width="55" height="45" fill="#cbd5e1" stroke="#94a3b8" stroke-width="2" rx="4"/>
    <rect x="25" y="-15" width="35" height="15" fill="#64748b"/>
    <text x="42" y="15" fill="#334155" font-size="10" font-weight="bold" text-anchor="middle">USB</text>

    <!-- DC Power Jack -->
    <rect x="190" y="-15" width="50" height="55" fill="#1e293b" rx="4"/>
    <circle cx="215" cy="15" r="10" fill="#0f172a"/>

    <!-- Main MCU ATmega328P -->
    <rect x="80" y="160" width="130" height="45" rx="4" fill="#0f172a" stroke="#334155" stroke-width="2"/>
    <circle cx="92" cy="182" r="4" fill="#475569"/>
    <text x="145" y="187" fill="#94a3b8" font-size="11" font-weight="bold" text-anchor="middle">ATmega328P</text>

    <!-- Crystal Oscillator -->
    <ellipse cx="60" cy="130" rx="8" ry="18" fill="#94a3b8" stroke="#64748b"/>

    <!-- Digital Header -->
    <rect x="235" y="40" width="18" height="260" fill="#0f172a" rx="3"/>
    <text x="225" y="30" fill="#00ffcc" font-size="11" font-weight="bold" text-anchor="end">DIGITAL (PWM~)</text>
    
    <!-- Pins 0 to 13 Labels -->
    <text x="228" y="55" fill="#ffffff" font-size="9">SCL</text>
    <text x="228" y="70" fill="#ffffff" font-size="9">SDA</text>
    <text x="228" y="85" fill="#00ffcc" font-size="9">GND</text>
    <text x="228" y="100" fill="#60a5fa" font-size="9">13</text>
    <text x="228" y="115" fill="#60a5fa" font-size="9">12</text>
    <text x="228" y="130" fill="#00ffcc" font-size="9">~11</text>
    <text x="228" y="145" fill="#00ffcc" font-size="9">~10</text>
    <text x="228" y="160" fill="#00ffcc" font-size="9">~9</text>
    <text x="228" y="175" fill="#60a5fa" font-size="9">8</text>
    <text x="228" y="190" fill="#60a5fa" font-size="9">7</text>
    <text x="228" y="205" fill="#00ffcc" font-size="9">~6</text>
    <text x="228" y="220" fill="#00ffcc" font-size="9">~5</text>
    <text x="228" y="235" fill="#60a5fa" font-size="9">4</text>
    <text x="228" y="250" fill="#00ffcc" font-size="9">~3</text>
    <text x="228" y="265" fill="#60a5fa" font-size="9">2</text>

    <!-- Power & Analog Header -->
    <rect x="5" y="200" width="18" height="120" fill="#0f172a" rx="3"/>
    <text x="28" y="195" fill="#ffcc00" font-size="11" font-weight="bold">POWER / ANALOG</text>
    <text x="28" y="215" fill="#ef4444" font-size="9">5V</text>
    <text x="28" y="230" fill="#3b82f6" font-size="9">GND</text>
    <text x="28" y="245" fill="#3b82f6" font-size="9">GND</text>
    <text x="28" y="265" fill="#34d399" font-size="9">A0</text>
    <text x="28" y="280" fill="#34d399" font-size="9">A1</text>
    <text x="28" y="295" fill="#34d399" font-size="9">A2</text>

    <!-- Logo text -->
    <text x="125" y="80" fill="#ffffff" font-size="18" font-weight="900" text-anchor="middle">ARDUINO</text>
    <text x="125" y="100" fill="#00e5ff" font-size="14" font-weight="bold" text-anchor="middle">UNO R3</text>
  </g>

  <!-- BREADBOARD GRAPHIC -->
  <g transform="translate(370, 90)">
    <rect x="0" y="0" width="490" height="350" rx="16" fill="url(#bbGrad)" stroke="#cbd5e1" stroke-width="3"/>
    
    <!-- Power Rails (+ Red & - Blue lines) -->
    <line x1="20" y1="20" x2="470" y2="20" stroke="#ef4444" stroke-width="3"/>
    <text x="10" y="24" fill="#ef4444" font-size="12" font-weight="bold">+</text>
    <line x1="20" y1="35" x2="470" y2="35" stroke="#3b82f6" stroke-width="3"/>
    <text x="10" y="39" fill="#3b82f6" font-size="12" font-weight="bold">-</text>

    <line x1="20" y1="315" x2="470" y2="315" stroke="#ef4444" stroke-width="3"/>
    <text x="10" y="319" fill="#ef4444" font-size="12" font-weight="bold">+</text>
    <line x1="20" y1="330" x2="470" y2="330" stroke="#3b82f6" stroke-width="3"/>
    <text x="10" y="334" fill="#3b82f6" font-size="12" font-weight="bold">-</text>

    <!-- Center Divider Trench -->
    <rect x="15" y="170" width="460" height="10" fill="#cbd5e1"/>
    <text x="245" y="178" fill="#64748b" font-size="9" font-weight="bold" text-anchor="middle">ELECTRONLEARNERS BREADBOARD TRENCH</text>
    
    <!-- Breadboard Pin Grid Holes -->
    <g fill="#475569">      <!-- Wires Pins 12, 11, 10 -->
      <path d="M -90 115 L 60 80" stroke="#ef4444" stroke-width="4" fill="none"/>
      <path d="M -90 130 L 60 130" stroke="#eab308" stroke-width="4" fill="none"/>
      <path d="M -90 145 L 60 180" stroke="#22c55e" stroke-width="4" fill="none"/>

      <!-- Red LED -->
      <circle cx="120" cy="80" r="14" fill="url(#ledRedGlow)" filter="url(#glow)"/>
      <text x="120" y="55" fill="#ef4444" font-size="11" font-weight="bold" text-anchor="middle">RED</text>

      <!-- Yellow LED -->
      <circle cx="120" cy="130" r="14" fill="url(#ledYellowGlow)" filter="url(#glow)"/>
      <text x="120" y="110" fill="#eab308" font-size="11" font-weight="bold" text-anchor="middle">YELLOW</text>

      <!-- Green LED -->
      <circle cx="120" cy="180" r="14" fill="url(#ledGreenGlow)" filter="url(#glow)"/>
      <text x="120" y="210" fill="#22c55e" font-size="11" font-weight="bold" text-anchor="middle">GREEN</text>

      <!-- 3x Resistors -->
      <rect x="150" y="74" width="40" height="12" fill="#d97706" rx="3"/>
      <rect x="150" y="124" width="40" height="12" fill="#d97706" rx="3"/>
      <rect x="150" y="174" width="40" height="12" fill="#d97706" rx="3"/>    </g>
  </g>
  
  <!-- Info Banner -->
  <rect x="25" y="455" width="850" height="30" rx="8" fill="#0f172a" stroke="#1e293b"/>
  <text x="45" y="475" fill="#94a3b8" font-size="11">ElectronLearners STEM Platform • Official Hardware Wiring Schematic</text>
</svg>

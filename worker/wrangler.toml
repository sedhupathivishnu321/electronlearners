name = "jrlearners-api"
main = "src/index.js"
compatibility_date = "2025-01-01"

# the deploy workflow creates the D1 database and writes its id here
[[d1_databases]]
binding = "DB"
database_name = "jrlearners"
database_id = "REPLACE_BY_WORKFLOW"

[triggers]
crons = ["*/10 * * * *"]      # retries unsent e-mails

[vars]
PAYU_ENV = "live"
FRONTEND_URL = "https://jrlearners.com"
CORS_ORIGINS = "https://jrlearners.com"
ADMIN_NOTIFY_EMAIL = "admin@jrlearners.com"

version: '3.8'

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: jrlearners-api
    env_file:
      - backend/.env          # PayU key / salt, admin login ... (see backend/.env.example)
    volumes:
      - orders_data:/data
    ports:
      - "8000:8000"

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: jrlearners-web
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  orders_data:

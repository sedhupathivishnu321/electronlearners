# Self-hosted production stack for the shop API (any VPS with Docker).
#   1. copy backend/.env.example to backend/.env and fill it in (PUBLIC_API_URL=https://api.jrlearners.com, TRUST_PROXY=1 ...)
#   2. export API_DOMAIN=api.jrlearners.com      (DNS A record -> this server, ports 80 and 443 open)
#   3. docker compose up -d --build
# The web site itself stays on GitHub Pages; set the repository variable API_URL=https://api.jrlearners.com
services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    restart: unless-stopped
    env_file:
      - backend/.env
    environment:
      - DATA_DIR=/data
    volumes:
      - app_data:/data          # SQLite database: back this volume up
    expose:
      - "8000"

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    environment:
      - API_DOMAIN=${API_DOMAIN:-localhost}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - backend

volumes:
  app_data:
  caddy_data:
  caddy_config:

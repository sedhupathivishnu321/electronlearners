name: Send a test e-mail

# Run manually (Actions tab -> "Send a test e-mail" -> Run workflow) to prove the Gmail login and the admin address work.
on:
  workflow_dispatch:

jobs:
  mail:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Send test mail to the admin address
        env:
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          SMTP_FROM: ${{ secrets.SMTP_FROM }}
          TO: ${{ vars.ADMIN_NOTIFY_EMAIL }}
        run: |
          python - <<'PY'
          import os, smtplib
          from email.message import EmailMessage
          m = EmailMessage()
          m["From"], m["To"], m["Subject"] = os.environ["SMTP_FROM"], os.environ["TO"], "[JR Learners] SMTP test"
          m.set_content("If you can read this, the JR Learners mail settings work.")
          s = smtplib.SMTP(os.environ["SMTP_HOST"], 587, timeout=30); s.starttls()
          s.login(os.environ["SMTP_USER"], os.environ["SMTP_PASSWORD"]); s.send_message(m); s.quit()
          print("sent")
          PY

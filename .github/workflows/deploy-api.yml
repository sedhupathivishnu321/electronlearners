name: Deploy API to server

# GitHub Pages can only host the static site, so the API (accounts, orders, PayU, mail) needs a server.
# This workflow copies the backend to your own server over SSH and starts it with Docker + Caddy.
# Set these once (Settings -> Secrets and variables -> Actions):
#   secrets:   SSH_HOST, SSH_USER, SSH_KEY (private key), ADMIN_EMAIL, ADMIN_PASSWORD   (the mail / PayU / SECRET_KEY secrets are already set)
#   variables: API_DOMAIN (e.g. api.jrlearners.com)
# Until SSH_HOST exists the job is skipped.
on:
  push:
    branches: [main]
    paths: ["backend/**", "Dockerfile.backend", "docker-compose.yml", "Caddyfile", ".github/workflows/deploy-api.yml"]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      HAS_SERVER: ${{ secrets.SSH_HOST != '' }}
    steps:
      - uses: actions/checkout@v4
        if: env.HAS_SERVER == 'true'
      - name: Write backend/.env from the secrets
        if: env.HAS_SERVER == 'true'
        env:
          API_DOMAIN: ${{ vars.API_DOMAIN }}
        run: |
          cat > backend/.env <<EOF
          SECRET_KEY=${{ secrets.SECRET_KEY }}
          ADMIN_EMAIL=${{ secrets.ADMIN_EMAIL }}
          ADMIN_PASSWORD=${{ secrets.ADMIN_PASSWORD }}
          FRONTEND_URL=https://jrlearners.com
          PUBLIC_API_URL=https://${API_DOMAIN}
          CORS_ORIGINS=https://jrlearners.com
          TRUST_PROXY=1
          PAYU_ENV=${{ vars.PAYU_ENV }}
          PAYU_KEY=${{ secrets.PAYU_KEY }}
          PAYU_SALT=${{ secrets.PAYU_SALT }}
          PAYU_CLIENT_ID=${{ secrets.PAYU_CLIENT_ID }}
          PAYU_CLIENT_SECRET=${{ secrets.PAYU_CLIENT_SECRET }}
          ADMIN_NOTIFY_EMAIL=${{ vars.ADMIN_NOTIFY_EMAIL }}
          SMTP_HOST=${{ secrets.SMTP_HOST }}
          SMTP_PORT=${{ vars.SMTP_PORT }}
          SMTP_SECURITY=${{ vars.SMTP_SECURITY }}
          SMTP_USER=${{ secrets.SMTP_USER }}
          SMTP_PASSWORD=${{ secrets.SMTP_PASSWORD }}
          SMTP_FROM=${{ secrets.SMTP_FROM }}
          EOF
          sed -i 's/^ *//' backend/.env
      - name: Copy files and start the stack
        if: env.HAS_SERVER == 'true'
        env:
          API_DOMAIN: ${{ vars.API_DOMAIN }}
        run: |
          install -m 700 -d ~/.ssh
          echo "${{ secrets.SSH_KEY }}" > ~/.ssh/id && chmod 600 ~/.ssh/id
          ssh-keyscan -H "${{ secrets.SSH_HOST }}" >> ~/.ssh/known_hosts
          T="${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}"
          tar czf - backend Dockerfile.backend docker-compose.yml Caddyfile | ssh -i ~/.ssh/id "$T" 'mkdir -p ~/jrlearners && tar xzf - -C ~/jrlearners && chmod 600 ~/jrlearners/backend/.env'
          ssh -i ~/.ssh/id "$T" "cd ~/jrlearners && API_DOMAIN=${API_DOMAIN} docker compose up -d --build"
      - name: Skipped
        if: env.HAS_SERVER != 'true'
        run: echo "No SSH_HOST secret yet: nothing to deploy to. See the comments at the top of this file."
